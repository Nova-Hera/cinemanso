name: deploy

on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  SSH_HOST: br.dotwired.org
  SSH_USER: dorosbr
  # Public host key of br.dotwired.org (ssh-ed25519), pinned so the deploy never trusts an unknown host.
  SSH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDq4yVwyrbj2Mxl3DQPsF2iIlMNVabbzGVapVn0x6Qfa
  REMOTE_DIR: /srv/docker/cinemanso

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build
        env:
          # Public Reverb client key (shipped to every browser anyway; must equal REVERB_APP_KEY in
          # the server's shared/.env). Vite inlines it at build time; without it resources/js/echo.js
          # never starts Echo. Host/port default to the page's own origin (Caddy proxies /app/*).
          VITE_REVERB_APP_KEY: 9c3593ecdef9aa4e8f2b

      - name: Package release
        run: |
          ln -sfn ../storage/app/public public/storage
          tar -czf /tmp/release.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./deploy' \
            --exclude='./.env*' \
            --exclude='./auth.json' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/cache/data/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/views/*' \
            .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # The secret may be the raw PEM (possibly with CRLF from Windows) or the same file base64-encoded on one line.
          if printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' | head -c 11 | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          # Safe diagnostics: shape only, never the key material.
          echo "key file: $(wc -c < ~/.ssh/deploy_key) bytes, $(wc -l < ~/.ssh/deploy_key) lines"
          head -1 ~/.ssh/deploy_key | cut -c1-40
          tail -1 ~/.ssh/deploy_key | cut -c1-40
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          echo "$SSH_HOST $SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/release.tar.gz deploy/Dockerfile deploy/docker-compose.yml deploy/remote-deploy.sh \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash $REMOTE_DIR/remote-deploy.sh"
