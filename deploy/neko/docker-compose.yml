# Reference copy of /srv/docker/neko/docker-compose.yml on br.dotwired.org (not deployed by CI).
# Not secret: the passwords come from /srv/docker/neko/.env (NEKO_PASSWORD / NEKO_ADMIN_PASSWORD,
# the same values the Laravel app has in its own .env).
#
# Caddy proxies https://neko-cinemanso.newhera.net -> neko:8080 (/srv/docker/caddy/sites-enabled/neko.caddy).
# WebRTC media goes straight to the host over a single UDP port (UDPMUX), so the Cloudflare record
# for the host must be "DNS only" (not proxied).
# The cloud firewall only lets UDP 24454 through (verified with a probe; 52000-52100, 26000 etc. are
# dropped), so UDPMUX uses 24454 — the port normally reserved for Minecraft Simple Voice Chat, free at
# the moment. If a voice-chat server ever needs it, open another UDP port in the cloud security list
# and change UDPMUX + the published port below.
services:
  neko:
    image: ghcr.io/m1k1o/neko/firefox:latest
    container_name: neko
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "24454:24454/udp"
    environment:
      NEKO_DESKTOP_SCREEN: 1920x1080@30
      # Members live in memory and are (re)created by the Laravel app through the admin API each time
      # someone opens /neko (App\Services\Neko::syncMember), so each user gets their own name + avatar
      # (the `multiuser` provider only has one fixed profile per role). Only the bot admin exists at boot;
      # it never connects, it is used by the app to manage members and to reset the room.
      NEKO_MEMBER_PROVIDER: object
      NEKO_MEMBER_OBJECT_USERS: '[{"username":"cinemanso-bot","password":"${NEKO_ADMIN_PASSWORD}","profile":{"name":"cinemanso-bot","is_admin":true,"can_login":true,"can_connect":false,"can_watch":false,"can_host":false,"can_share_media":false,"can_access_clipboard":false,"sends_inactive_cursor":false,"can_see_inactive_cursors":false}}]'
      NEKO_WEBRTC_UDPMUX: "24454"
      NEKO_WEBRTC_ICELITE: "1"
      NEKO_WEBRTC_NAT1TO1: 147.15.9.221
    # Fullscreen estilo Hyperbeam: nekofs.css/js (deploy/neko/, copiados para /srv/docker/neko/) são
    # injetados no index.html do cliente a cada boot, então sobrevivem a atualização da imagem.
    # O `?v=` evita cache; suba o número quando mudar um dos arquivos.
    volumes:
      - ./nekofs.css:/var/www/nekofs.css:ro
      - ./nekofs.js:/var/www/nekofs.js:ro
    command:
      - /bin/sh
      - -c
      - "grep -q nekofs /var/www/index.html || sed -i 's#</head>#<link rel=\"stylesheet\" href=\"./nekofs.css?v=3\"><script src=\"./nekofs.js?v=3\"></script></head>#' /var/www/index.html; exec /usr/bin/supervisord -c /etc/neko/supervisord.conf"
    networks:
      - webserver

networks:
  webserver:
    external: true
